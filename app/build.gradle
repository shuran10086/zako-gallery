plugins {
    id 'com.android.application'
}

android {
    compileSdk 33
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.zako.gallery"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {
        release {
            // The signing material is intentionally not part of the repository.
            // With keystore.properties present the release build is signed;
            // without it (e.g. a fresh clone) an unsigned APK is produced.
            def propsFile = rootProject.file('keystore.properties')
            if (!propsFile.exists()) return
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            storeFile rootProject.file(props.getProperty('storeFile', 'randomwallpaper.jks'))
            storePassword props.getProperty('storePassword')
            keyAlias props.getProperty('keyAlias')
            keyPassword props.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            signingConfig rootProject.file('keystore.properties').exists()
                    ? signingConfigs.release : null
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.activity:activity:1.7.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
}

configurations.all {
    resolutionStrategy {
        // Keep the kotlin stdlib family on one version; an old transitive
        // kotlin-stdlib-jdk7/jdk8:1.6.21 otherwise duplicates classes.
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
    }
}
